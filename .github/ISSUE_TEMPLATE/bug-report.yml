name: Bug report
description: Something does not work as the README says
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of claude --version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /tokenwise
      render: text
